<app-busy-indicator [busy]="busy()"></app-busy-indicator>
<app-alert></app-alert>

<h1 class="m-2">Новая задача</h1>

<div class="container">
  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="mb-3">
      <label for="title" class="form-label">Название задачи *</label>
      <input
        type="text"
        class="form-control"
        id="title"
        formControlName="title"
      />
    </div>
    <div class="mb-3">
      <label for="description" class="form-label">Описание задачи</label>
      <textarea
        class="form-control"
        id="description"
        rows="3"
        formControlName="description"
      ></textarea>
    </div>
    <div class="d-flex flex-sm-row flex-column gap-2 justify-content-center">
      <button type="submit" class="btn btn-primary" [disabled]="form.invalid">
        Создать
      </button>
      <button
        type="button"
        class="btn btn-secondary"
        (click)="onCancelClicked()"
      >
        Отмена
      </button>
    </div>
  </form>
</div>
